[build-system]
requires = ["setuptools>=77", "torch>=2.5"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-to-probe"
version = "0.1.0"
description = "Learning to Probe: learned routing and adaptive probing for vector search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "third_party/rotlex/LICENSE"]
dependencies = ["faiss-cpu>=1.9", "numpy>=2.0", "pydantic>=2.11", "torch>=2.5"]

[project.optional-dependencies]
test = ["pytest>=8", "matplotlib>=3.9"]
plot = ["matplotlib>=3.9"]

[project.scripts]
learning-to-probe = "ft_anns.cli:main"
ft-anns = "ft_anns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ft_anns = ["fixtures/*.json"]
"ft_anns.adaptive_query" = ["*.cpp", "*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
